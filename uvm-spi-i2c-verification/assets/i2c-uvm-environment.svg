<text x="1060" y="320" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">SDA: drive Low / release Z + pull-up</text>
<rect x="640" y="500" width="380" height="190" fill="#f1f2f1" stroke="#39413b" stroke-width="2"/>
<text x="830.0" y="552.7950000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202421">Scoreboard</text>
<text x="830.0" y="586.1450000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Data + ACK / NACK</text>
<text x="830.0" y="619.4950000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Wrong-address NACK</text>
<text x="830.0" y="652.845" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">17,500 PASS checks</text>
<rect x="1100" y="500" width="470" height="190" fill="white" stroke="#39413b" stroke-width="2"/>
<text x="1335.0" y="541.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#202421">Coverage Subscriber</text>
<text x="1335.0" y="571.69" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202421">6 coverpoints: 100% each</text>
<text x="1335.0" y="602.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202421">OP x ACK / Address Match / R-W</text>
<text x="1335.0" y="632.59" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202421">3 crosses: 50% each</text>
<text x="1335.0" y="663.04" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#202421">Total: 83.33%</text>
<polyline points="800,280 800,420 830,420 830,500" fill="none" stroke="#39413b" stroke-width="2.5"/>
<polygon points="830,500 825.0,488.0 835.0,488.0" fill="#39413b"/>
<polyline points="900,280 900,380 1335,380 1335,500" fill="none" stroke="#39413b" stroke-width="2.5"/>
<polygon points="1335,500 1330.0,488.0 1340.0,488.0" fill="#39413b"/>
<text x="30" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Driver Analysis Port -&gt; Scoreboard / Coverage; no independent I2C Monitor in this testbench.</text>
<text x="30" y="788" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Write | Read | Write -&gt; STOP -&gt; START -&gt; Read | Wrong Address</text></svg>
