<text x="800.0" y="211.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202421">START / WRITE / READ / STOP</text>
<text x="800.0" y="240.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#202421">Sample after completion</text>
