<text x="475.0" y="186.14499999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202421">Sequencer</text>
<text x="475.0" y="219.49499999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Sequence items</text>
<rect x="640" y="120" width="300" height="150" fill="white" stroke="#39413b" stroke-width="2"/>
<text x="790.0" y="169.47" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202421">Driver</text>
<text x="790.0" y="202.82" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Master / Slave TX</text>
<text x="790.0" y="236.17000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Start + completion wait</text>
<rect x="1040" y="120" width="500" height="150" fill="#f1f2f1" stroke="#39413b" stroke-width="2"/>
<text x="1290.0" y="169.47" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202421">SPI Master + Slave</text>
<text x="1290.0" y="202.82" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">SS_N / SCLK / MOSI -&gt;</text>
<text x="1290.0" y="236.17000000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">&lt;- MISO</text>
