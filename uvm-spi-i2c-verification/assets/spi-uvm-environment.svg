<text x="860.0" y="581.53" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">Slave RX = Master TX</text>
<text x="860.0" y="613.43" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">Master RX = Slave TX</text>
<text x="860.0" y="645.3299999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">Busy / Done state checks</text>
