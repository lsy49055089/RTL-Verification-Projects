<text x="1330.0" y="613.43" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">Completed transfer observations</text>
<polyline points="1160,450 1160,485 860,485 860,520" fill="none" stroke="#39413b" stroke-width="2.5"/>
<polygon points="860,520 855.0,508.0 865.0,508.0" fill="#39413b"/>
