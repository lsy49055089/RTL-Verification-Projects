<polygon points="1420,520 1415.0,508.0 1425.0,508.0" fill="#39413b"/>
<text x="30" y="710" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">SPI Monitor sends observations to Scoreboard and Coverage through Analysis Ports.</text></svg>
