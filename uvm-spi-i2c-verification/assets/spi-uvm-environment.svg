<rect x="30" y="120" width="280" height="150" fill="#f1f2f1" stroke="#39413b" stroke-width="2"/>
<text x="170.0" y="170.57999999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202421">Sequence</text>
<text x="170.0" y="202.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">8 directed + 9,992 random</text>
<text x="170.0" y="234.38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202421">10,000 transactions</text>
