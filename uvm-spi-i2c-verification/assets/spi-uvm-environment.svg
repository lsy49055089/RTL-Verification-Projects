<text x="1290.0" y="364.46999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#202421">Monitor</text>
<text x="1290.0" y="397.82" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">Busy / Done during transfer</text>
<text x="1290.0" y="431.16999999999996" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#202421">TX / RX at transfer completion</text>
<rect x="640" y="520" width="440" height="140" fill="#f1f2f1" stroke="#39413b" stroke-width="2"/>
