<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img"><title>SPI UVM: stimulus, independent Monitor and automated checks</title>
<rect width="100%" height="100%" fill="white"/>
